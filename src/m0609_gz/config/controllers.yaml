controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    rg2_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true

joint_trajectory_controller:
  ros__parameters:
    use_sim_time: true
    joints: [joint_1, joint_2, joint_3, joint_4, joint_5, joint_6]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    constraints:
      goal_time: 2.0
      joint_1: {goal: 0.01}
      joint_2: {goal: 0.01}
      joint_3: {goal: 0.01}
      joint_4: {goal: 0.01}
      joint_5: {goal: 0.01}
      joint_6: {goal: 0.01}

rg2_controller:
  ros__parameters:
    use_sim_time: true
    joints: [rg2_finger_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    constraints:
      goal_time: 2.0
      rg2_finger_joint: {goal: 0.01}
